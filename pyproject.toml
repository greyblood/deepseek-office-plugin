[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-mcp"
version = "0.1.0"
description = "Production-quality Excel automation MCP server for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DeepSeek Excel Studio Team" }
]
dependencies = [
    "mcp>=1.1.2",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
excel-mcp = "excel_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
